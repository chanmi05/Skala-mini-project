services:
  mariadb:
    image: mariadb:11.8
    container_name: workplace-mariadb-53301
    restart: unless-stopped
    ports:
      - "127.0.0.1:53301:3306"
    environment:
      MARIADB_DATABASE: sql_db
      MARIADB_USER: user
      MARIADB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in workplace/.env}"
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mariadb_53301_data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mariadb_53301_data:
