<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입 · 휴가 낼게요</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h1>회원가입</h1>
    <form method="POST" action="/api/signup">
        <label>이름
            <input type="text" name="name" required maxlength="100" autocomplete="name">
        </label>
        <label>사원번호
            <input type="text" name="employeeId" required maxlength="100" autocomplete="username">
        </label>
        <label>비밀번호
            <input type="password" name="password" required minlength="8" maxlength="64" autocomplete="new-password">
        </label>
        <button type="submit">Sign Up</button>
    </form>
    <p><a href="/login">Back to Login</a></p>
</div>
<script src="/static/app.js"></script>
</body>
</html>
